name: Household static and pricing checks
on:
  push:
    branches: [main, household-hardening-20261103]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline application tests
        run: |
          node tests/household-smoke.mjs
          node tests/google-calendar-oauth.mjs
          node tests/calendar-account-isolation.mjs
          node tests/imported-event-status.mjs
          node tests/lesson-status-controls.mjs
          node tests/activity-note-text.mjs
          node tests/lesson-inline-notes.mjs
          node tests/email-inbound.mjs
          node tests/calendar-conversion.mjs
          node tests/google-calendar-error-reasons.mjs
